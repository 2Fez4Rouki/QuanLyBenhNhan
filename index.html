<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medi & Task PWA</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
    <!-- Header -->
    <header class="bg-pink-200 text-rose-900 p-4 text-center font-bold text-lg shadow">
      🏥 Quản Lý Bệnh Nhân & Công Việc
    </header>

    <!-- Main Content Tabs -->
    <main class="flex-1 p-4 overflow-y-auto mb-16">
      <!-- Tab 1: Patients -->
      <div id="tab-patients" class="tab-content">
        <!-- Reminder Banner -->
        <div id="reminder-banner" class="hidden bg-amber-100 border-l-4 border-amber-500 text-amber-700 p-3 text-sm mb-4 rounded"></div>

        <div class="flex justify-between items-center mb-4">
          <h2 class="font-bold text-xl text-blue-900">Danh Sách Bệnh Nhân</h2>
          <div class="space-x-1 flex items-center flex-wrap gap-y-1">
            <button onclick="PatientManager.toggleTodayList()" id="btn-today-toggle" class="bg-pink-200 text-rose-900 text-xs px-2.5 py-1.5 rounded font-medium hover:bg-amber-700 transition">📅 Tái khám</button>
            <button onclick="PatientManager.toggleAllPatientsList()" id="btn-all-toggle" class="bg-pink-200 text-rose-900 text-xs px-2.5 py-1.5 rounded font-medium hover:bg-blue-700 transition">👥 DS Bệnh Nhân</button>
            <button onclick="PatientManager.exportJSON()" class="bg-pink-200 text-rose-900 text-xs px-2.5 py-1.5 rounded font-medium hover:bg-green-700 transition">Xuất</button>
            <label class="bg-pink-200 text-rose-900 text-xs px-2.5 py-1.5 rounded font-medium cursor-pointer hover:bg-indigo-700 transition">
              Nhập <input type="file" accept=".json" onchange="PatientManager.importJSON(event)" class="hidden">
            </label>
          </div>
        </div>

        <!-- Khung chứa danh sách tái khám hôm nay -->
        <div id="today-patient-container" class="hidden mb-4"></div>

        <!-- Search Bar -->
        <div class="mb-3">
          <input type="text" id="p-search" oninput="PatientManager.handleSearch(event)" placeholder="🔍 Tìm kiếm (Tên, SĐT, ngày tái khám...)" class="w-full text-sm border p-2 rounded-xl bg-gray-50 focus:outline-none focus:border-blue-500">
        </div>

        <!-- Add Patient Form -->
        <form onsubmit="PatientManager.addPatient(event)" class="bg-gray-50 p-3 rounded-xl border mb-4 space-y-2">
          <input type="text" id="p-name" placeholder="Họ tên bệnh nhân" required class="w-full text-sm border p-2 rounded focus:outline-none focus:border-blue-500">
          <div class="flex space-x-2">
            <input type="date" id="p-dob" title="Ngày sinh" required class="w-1/2 text-sm border p-2 rounded focus:outline-none focus:border-blue-500">
            <input type="tel" id="p-phone" placeholder="Số điện thoại" required class="w-1/2 text-sm border p-2 rounded focus:outline-none focus:border-blue-500">
          </div>
          <div class="flex items-center space-x-2">
            <label class="text-xs text-gray-500 font-medium">Ngày tái khám:</label>
            <input type="date" id="p-next-date" class="flex-1 text-sm border p-2 rounded focus:outline-none focus:border-blue-500">
          </div>
          <textarea id="p-note" placeholder="Ghi chú tổng quan bệnh lý..." class="w-full text-sm border p-2 rounded focus:outline-none focus:border-blue-500"></textarea>
          <button type="submit" class="w-full bg-pink-200 text-rose-900 py-2 rounded font-medium text-sm hover:bg-blue-700">Thêm Bệnh Nhân</button>
        </form>

        <div id="patient-list"></div>
      </div>

      <!-- Tab 2: Todos -->
      <div id="tab-todos" class="tab-content hidden">
        <h2 class="font-bold text-xl text-blue-900 mb-4">Danh Sách Công Việc</h2>
        
        <form onsubmit="TodoManager.addTodo(event)" class="flex space-x-2 mb-4">
          <input type="text" id="todo-title" placeholder="Thêm công việc chính mới..." required class="flex-1 text-sm border p-2 rounded-xl focus:outline-none focus:border-blue-500">
          <button type="submit" class="bg-pink-200 text-rose-900 px-4 rounded-xl font-medium text-sm">Thêm</button>
        </form>

        <div id="todo-list"></div>
      </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bg-white border-t flex fixed bottom-0 max-w-md w-full shadow-inner">
      <button onclick="switchTab('tab-patients')" id="btn-tab-patients" class="tab-btn flex-1 py-3 text-center text-sm font-semibold bg-pink-200 text-rose-900 transition">
        👥 Bệnh Nhân
      </button>
      <button onclick="switchTab('tab-todos')" id="btn-tab-todos" class="tab-btn flex-1 py-3 text-center text-sm font-semibold bg-pink-200 text-rose-900 transition">
        📋 Công Việc
      </button>
    </nav>
  </div>

  <script type="module" src="js/storage.js"></script>
  <script type="module" src="js/patients.js"></script>
  <script type="module" src="js/todos.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
