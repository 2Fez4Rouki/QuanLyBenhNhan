<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medi & Task</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#be185d">
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800 selection:bg-pink-500 selection:text-white">

  <!-- 🔒 Màn hình đăng nhập -->
  <div id="auth-screen" class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col justify-center items-center p-6">
    <div class="w-full max-w-sm bg-pink-50 p-6 rounded-2xl border border-pink-200 shadow-sm space-y-4">
      <h2 class="text-center font-bold text-rose-900 text-lg">🔒 Đăng Nhập Hệ Thống</h2>
      
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Email</label>
        <input type="email" id="auth-email" placeholder="Email của bạn" class="w-full text-sm border p-3 rounded-xl bg-white focus:outline-none focus:border-pink-500 transition">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Mật khẩu</label>
        <input type="password" id="auth-password" placeholder="Mật khẩu" class="w-full text-sm border p-3 rounded-xl bg-white focus:outline-none focus:border-pink-500 transition">
      </div>
      
      <!-- Ô tích nhớ mật khẩu -->
      <div class="flex items-center space-x-2 text-sm text-gray-700 pt-1">
        <input type="checkbox" id="remember-me" class="w-4 h-4 text-pink-600 border-gray-300 rounded focus:ring-pink-500 cursor-pointer">
        <label for="remember-me" class="cursor-pointer select-none text-xs font-medium text-gray-600">Nhớ mật khẩu cho lần sau</label>
      </div>

      <button onclick="AuthManager.login()" class="w-full bg-pink-600 text-white py-3 rounded-xl font-medium text-sm hover:bg-pink-700 transition shadow-md active:scale-95">Đăng Nhập</button>
      
      <div id="auth-error" class="text-red-500 text-xs text-center font-medium"></div>
    </div>
  </div>

  <!-- 📱 Nội dung ứng dụng chính -->
  <div id="main-app-container" class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col hidden">
    
    <!-- 🔍 Thanh tìm kiếm chung (Ghi chú chung) -->
    <div class="p-4 bg-pink-600 text-white sticky top-0 z-20 shadow-md space-y-3">
      <div class="flex justify-between items-center">
        <h1 class="font-bold text-lg">Medi & Task</h1>
        <!-- Nút đăng xuất nhanh nếu cần -->
        <button onclick="auth.signOut()" class="text-xs bg-pink-700 hover:bg-pink-800 px-3 py-1.5 rounded-lg transition">Đăng xuất</button>
      </div>
      <div class="relative">
        <input type="text" id="global-search" placeholder="🔍 Tìm kiếm nhanh ghi chú chung, công việc, bệnh nhân..." class="w-full text-sm text-gray-800 px-4 py-2.5 rounded-xl bg-white focus:outline-none shadow-inner">
      </div>
    </div>

    <!-- Khu vực hiển thị nội dung các tab (Bệnh nhân, Công việc, v.v.) -->
    <div class="flex-1 p-4 overflow-y-auto space-y-4 pb-20">
      <!-- Tab Bệnh Nhân -->
      <div id="patients-tab" class="space-y-3">
        <!-- Nội dung quản lý bệnh nhân của bạn sẽ render vào đây -->
      </div>

      <!-- Tab Công Việc / Ghi Chú -->
      <div id="todos-tab" class="space-y-3 hidden">
        <!-- Nội dung quản lý công việc/sub-task của bạn sẽ render vào đây -->
      </div>
    </div>

    <!-- Thanh điều hướng dưới cùng (Bottom Navigation) -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 flex justify-around p-3 z-20 shadow-lg">
      <button onclick="switchTab('patients')" id="nav-patients" class="flex flex-col items-center text-pink-600 font-medium text-xs">
        <span>👥 Bệnh Nhân</span>
      </button>
      <button onclick="switchTab('todos')" id="nav-todos" class="flex flex-col items-center text-gray-400 font-medium text-xs">
        <span>📋 Công Việc</span>
      </button>
    </div>

  </div>

  <!-- Scripts Logic -->
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/patients.js"></script>
  <script type="module" src="js/todos.js"></script>
  <script type="module" src="js/app.js"></script>
  
  <script>
    // Hàm chuyển đổi tab giao diện cơ bản nếu app dùng cơ chế này
    function switchTab(tabName) {
      const pTab = document.getElementById('patients-tab');
      const tTab = document.getElementById('todos-tab');
      const nPat = document.getElementById('nav-patients');
      const nTod = document.getElementById('nav-todos');

      if (tabName === 'patients') {
        pTab.classList.remove('hidden');
        tTab.classList.add('hidden');
        nPat.className = "flex flex-col items-center text-pink-600 font-medium text-xs";
        nTod.className = "flex flex-col items-center text-gray-400 font-medium text-xs";
      } else {
        pTab.classList.add('hidden');
        tTab.classList.remove('hidden');
        nPat.className = "flex flex-col items-center text-gray-400 font-medium text-xs";
        nTod.className = "flex flex-col items-center text-pink-600 font-medium text-xs";
      }
    }
  </script>
</body>
</html>
